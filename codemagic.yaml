workflows:
  android-build:
    name: Build Android APK
    instance_type: linux
    environment:
      java: 17
    scripts:
      - name: Grant execute permission for gradlew
        script: chmod +x gradlew
      - name: Build Debug APK
        script: ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/**/*.apk
